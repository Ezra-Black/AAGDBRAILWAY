<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Audrey’s Angel Graphics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dusk: "#0a0806",
              honey: "#f0c45c",
              cream: "#fff6e4",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body data-no-popup class="flex min-h-screen items-center justify-center px-5 py-10">
    <div class="orb" style="width:280px;height:280px;background:#f0c45c;top:14%;left:10%;opacity:0.14"></div>
    <div class="orb" style="width:320px;height:320px;background:#e8a838;bottom:10%;right:8%;opacity:0.1;animation-delay:1.2s"></div>

    <main class="relative z-10 w-full max-w-sm">
      <div class="text-center">
        <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold" style="color:var(--cream);text-decoration:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z" fill="#f0c45c" />
          </svg>
          Audrey’s Angel Graphics
        </a>
        <h1 class="headline mt-6 text-3xl font-bold text-cream">Admin login</h1>
        <p class="mt-2 text-sm text-cream/50">Sign in to manage requests.</p>
      </div>

      <form id="login-form" class="glass-panel mt-8 space-y-4 rounded-[1.75rem] p-6 sm:p-7" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required placeholder="you@email.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••••" />
        </div>
        <button id="login-btn" type="submit" class="btn-primary w-full">
          Log in
        </button>
        <p id="message" class="hidden text-sm" role="status"></p>
      </form>

      <p class="mt-8 text-center text-xs text-cream/35">
        <a href="/" class="underline decoration-honey/30 underline-offset-2 hover:text-cream/60">Back to home</a>
      </p>
    </main>

    <script>
      (async () => {
        try {
          const me = await fetch("/admin/me", { credentials: "include" });
          if (me.ok) window.location.href = "/admin/";
        } catch {}
      })();

      const form = document.getElementById("login-form");
      const btn = document.getElementById("login-btn");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        message.classList.add("hidden");
        btn.disabled = true;
        btn.textContent = "Signing in…";

        try {
          const res = await fetch("/admin/login", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            message.textContent = data.error || "Login failed";
            message.className = "text-sm text-rose-400";
            return;
          }
          window.location.href = "/admin/";
        } catch {
          message.textContent = "Network error";
          message.className = "text-sm text-rose-400";
        } finally {
          btn.disabled = false;
          btn.textContent = "Log in";
        }
      });
    </script>
  </body>
</html>
